<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declara.pe — Pronto.</title>
  <meta name="description" content="Contabilidad inteligente para PYMEs del Perú. Pronto.">
  <meta property="og:title" content="Declara.pe">
  <meta property="og:description" content="Contabilidad inteligente para PYMEs del Perú. Pronto.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://declara.pe">
  <meta name="theme-color" content="#0B0E13">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --obsidian-deep: #050810;
      --obsidian: #0B0E13;
      --obsidian-soft: #161B22;
      --mint: #5EE5A1;
      --mint-deep: #2EBE7A;
      --text: #E6EDF3;
      --text-strong: #FFFFFF;
      --text-muted: #8B949E;
      --text-faint: #565F6B;
      --border: #2A323D;
    }

    html, body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--obsidian-deep);
      color: var(--text);
      line-height: 1.55;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Mint glow ambient */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 15%, rgba(94,229,161,0.10) 0%, transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(94,229,161,0.07) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
      animation: glowShift 28s ease-in-out infinite alternate;
    }
    @keyframes glowShift {
      from { transform: translate(0, 0); }
      to   { transform: translate(40px, -30px); }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .logo {
      width: 88px;
      height: 88px;
      background: var(--mint);
      color: var(--obsidian);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 56px;
      letter-spacing: -2px;
      margin-bottom: 56px;
      box-shadow: 0 0 0 1px rgba(94,229,161,0.3), 0 12px 48px rgba(94,229,161,0.25);
      animation: logoIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: translateY(20px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1 {
      font-size: clamp(72px, 14vw, 144px);
      font-weight: 800;
      letter-spacing: -5px;
      line-height: 0.95;
      color: var(--text-strong);
      margin-bottom: 16px;
      animation: textIn 0.9s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .tagline {
      font-size: clamp(16px, 2.2vw, 20px);
      color: var(--text-muted);
      font-weight: 400;
      max-width: 540px;
      margin: 0 auto 56px;
      line-height: 1.5;
      animation: textIn 0.9s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .tagline strong { color: var(--mint); font-weight: 600; }

    @keyframes textIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Form container */
    .waitlist {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      animation: textIn 0.9s 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .waitlist-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--mint);
      margin-bottom: 16px;
    }

    /* PLACEHOLDER FORM — Reemplazar con embed ConvertKit (ver README) */
    .waitlist-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .waitlist-form input[type="email"] {
      flex: 1;
      min-width: 240px;
      padding: 16px 20px;
      background: var(--obsidian-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .waitlist-form input[type="email"]:focus {
      outline: none;
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgba(94,229,161,0.15);
    }
    .waitlist-form input[type="email"]::placeholder { color: var(--text-faint); }

    .waitlist-form button {
      padding: 16px 28px;
      background: var(--mint);
      color: var(--obsidian);
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: -0.2px;
    }
    .waitlist-form button:hover { background: var(--mint-deep); }
    .waitlist-form button:active { transform: scale(0.98); }

    .waitlist-note {
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--text-faint);
    }

    /* Footer */
    footer {
      padding: 40px 24px 28px;
      text-align: center;
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      margin: 80px 24px 0;
    }

    .handle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .handle a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .handle a:hover { color: var(--mint); }

    .copyright {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--text-faint);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Mobile tweaks */
    @media (max-width: 640px) {
      .logo { width: 72px; height: 72px; font-size: 44px; margin-bottom: 40px; }
      h1 { letter-spacing: -3px; }
      .tagline { margin-bottom: 40px; }
      .waitlist-form { flex-direction: column; }
      .waitlist-form button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="Declara.pe">D</div>

    <h1>Pronto.</h1>

    <p class="tagline">
      Contabilidad inteligente para PYMEs del Perú.<br>
      <strong>Sin Excel. Sin estrés. Sin sorpresas con SUNAT.</strong>
    </p>

    <div class="waitlist">
      <div class="waitlist-eyebrow">Sumate a la waitlist</div>

  </main>

    <div class="copyright">© 2026 SOULWOVEN CO E.I.R.L. · RUC 20615441300</div>
  </footer>
</body>
</html>
