<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declara.pe — Pronto.</title>
  <meta name="description" content="Contabilidad inteligente para PYMEs del Perú. Pronto.">
  <meta property="og:title" content="Declara.pe">
  <meta property="og:description" content="Contabilidad inteligente para PYMEs del Perú. Pronto.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://declara.pe">
  <meta name="theme-color" content="#0B0E13">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --obsidian-deep: #050810;
      --obsidian: #0B0E13;
      --obsidian-soft: #161B22;
      --mint: #5EE5A1;
      --mint-deep: #2EBE7A;
      --text: #E6EDF3;
      --text-strong: #FFFFFF;
      --text-muted: #8B949E;
      --text-faint: #565F6B;
      --border: #2A323D;
    }

    html, body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--obsidian-deep);
      color: var(--text);
      line-height: 1.55;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Mint glow ambient */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 15%, rgba(94,229,161,0.10) 0%, transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(94,229,161,0.07) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
      animation: glowShift 28s ease-in-out infinite alternate;
    }
    @keyframes glowShift {
      from { transform: translate(0, 0); }
      to   { transform: translate(40px, -30px); }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .logo {
      width: 88px;
      height: 88px;
      background: var(--mint);
      color: var(--obsidian);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 56px;
      letter-spacing: -2px;
      margin-bottom: 56px;
      box-shadow: 0 0 0 1px rgba(94,229,161,0.3), 0 12px 48px rgba(94,229,161,0.25);
      animation: logoIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: translateY(20px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1 {
      font-size: clamp(72px, 14vw, 144px);
      font-weight: 800;
      letter-spacing: -5px;
      line-height: 0.95;
      color: var(--text-strong);
      margin-bottom: 16px;
      animation: textIn 0.9s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .tagline {
      font-size: clamp(16px, 2.2vw, 20px);
      color: var(--text-muted);
      font-weight: 400;
      max-width: 540px;
      margin: 0 auto 56px;
      line-height: 1.5;
      animation: textIn 0.9s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .tagline strong { color: var(--mint); font-weight: 600; }

    @keyframes textIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Form container */
    .waitlist {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      animation: textIn 0.9s 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .waitlist-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--mint);
      margin-bottom: 16px;
    }

    /* PLACEHOLDER FORM — Reemplazar con embed ConvertKit (ver README) */
    .waitlist-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .waitlist-form input[type="email"] {
      flex: 1;
      min-width: 240px;
      padding: 16px 20px;
      background: var(--obsidian-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .waitlist-form input[type="email"]:focus {
      outline: none;
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgba(94,229,161,0.15);
    }
    .waitlist-form input[type="email"]::placeholder { color: var(--text-faint); }

    .waitlist-form button {
      padding: 16px 28px;
      background: var(--mint);
      color: var(--obsidian);
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: -0.2px;
    }
    .waitlist-form button:hover { background: var(--mint-deep); }
    .waitlist-form button:active { transform: scale(0.98); }

    .waitlist-note {
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--text-faint);
    }

    /* Footer */
    footer {
      padding: 40px 24px 28px;
      text-align: center;
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      margin: 80px 24px 0;
    }

    .handle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .handle a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .handle a:hover { color: var(--mint); }

    .copyright {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--text-faint);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Mobile tweaks */
    @media (max-width: 640px) {
      .logo { width: 72px; height: 72px; font-size: 44px; margin-bottom: 40px; }
      h1 { letter-spacing: -3px; }
      .tagline { margin-bottom: 40px; }
      .waitlist-form { flex-direction: column; }
      .waitlist-form button { width: 100%; }
    }

    /* ============================================================
       Kit (ConvertKit) form overrides — estetica Declara + motion
       ============================================================ */
    .formkit-form[data-uid="267ce23abe"] {
      max-width: 480px !important;
      width: 100% !important;
      margin: 0 auto !important;
      padding: 0 !important;
      background: transparent !important;
    }
    .formkit-form[data-uid="267ce23abe"] [data-style="clean"] {
      padding: 0 !important;
      width: 100% !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-fields {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      gap: 10px !important;
      margin: 0 !important;
      align-items: stretch !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-field {
      flex: 1 1 auto !important;
      min-width: 0 !important;
      margin: 0 !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-input {
      background: var(--obsidian-soft) !important;
      border: 1.5px solid var(--border) !important;
      border-radius: 12px !important;
      color: var(--text) !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 16px !important;
      font-weight: 400 !important;
      padding: 18px 22px !important;
      line-height: 1.4 !important;
      width: 100% !important;
      height: 58px !important;
      box-sizing: border-box !important;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-input:hover {
      border-color: var(--text-faint) !important;
      background: rgba(22, 27, 34, 0.85) !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-input:focus {
      outline: none !important;
      border-color: var(--mint) !important;
      box-shadow: 0 0 0 4px rgba(94, 229, 161, 0.18), 0 0 24px rgba(94, 229, 161, 0.08) !important;
      background: var(--obsidian-soft) !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-input::placeholder {
      color: var(--text-faint) !important;
      opacity: 1 !important;
    }
    /* Botón */
    .formkit-form[data-uid="267ce23abe"] .formkit-submit {
      background-color: var(--mint) !important;
      color: var(--obsidian) !important;
      border: none !important;
      border-radius: 12px !important;
      font-family: 'Inter', sans-serif !important;
      font-weight: 700 !important;
      font-size: 16px !important;
      letter-spacing: -0.2px !important;
      cursor: pointer !important;
      margin: 0 !important;
      padding: 0 !important;
      height: 58px !important;
      min-width: 140px !important;
      flex: 0 0 auto !important;
      position: relative !important;
      overflow: hidden !important;
      box-shadow: 0 0 0 1px rgba(94, 229, 161, 0.3), 0 8px 28px rgba(94, 229, 161, 0.18) !important;
      transition: background-color 0.25s ease, transform 0.12s ease, box-shadow 0.25s ease !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-submit > span {
      padding: 0 28px !important;
      transition: none !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      height: 100% !important;
      background: transparent !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-submit::before {
      content: "" !important;
      position: absolute !important;
      inset: 0 !important;
      background: radial-gradient(circle at center, rgba(255,255,255,0.25), transparent 60%) !important;
      opacity: 0 !important;
      transition: opacity 0.3s ease !important;
      pointer-events: none !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-submit:hover {
      background-color: var(--mint-deep) !important;
      box-shadow: 0 0 0 1px rgba(94, 229, 161, 0.5), 0 12px 36px rgba(94, 229, 161, 0.32) !important;
      transform: translateY(-1px) !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-submit:hover::before {
      opacity: 1 !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-submit:hover > span {
      background-color: transparent !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-submit:active {
      transform: translateY(0) scale(0.98) !important;
    }
    /* Spinner (loading state) */
    .formkit-form[data-uid="267ce23abe"] .formkit-submit[data-active] .formkit-spinner {
      opacity: 1 !important;
      width: 28px !important;
      height: 100% !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-spinner > div {
      background-color: var(--obsidian) !important;
      opacity: 0.5 !important;
    }
    /* Ocultar "Built with Kit" */
    .formkit-form[data-uid="267ce23abe"] .formkit-powered-by-convertkit-container {
      display: none !important;
    }
    /* Alertas - Kit las inserta arriba */
    .formkit-form[data-uid="267ce23abe"] .formkit-alert {
      background: var(--obsidian-soft) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      border-radius: 12px !important;
      margin: 0 0 14px 0 !important;
      padding: 14px 18px !important;
      font-size: 14px !important;
      font-family: 'Inter', sans-serif !important;
      text-align: center !important;
      animation: alertIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both !important;
    }
    /* Ocultar alert vacío (solo aparece cuando Kit le mete contenido) */
    .formkit-form[data-uid="267ce23abe"] .formkit-alert:empty {
      display: none !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
    }
    @keyframes alertIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-alert-success {
      background: rgba(94, 229, 161, 0.08) !important;
      border-color: rgba(94, 229, 161, 0.4) !important;
      color: var(--mint) !important;
      font-weight: 500 !important;
    }
    .formkit-form[data-uid="267ce23abe"] .formkit-alert-error {
      background: rgba(248, 81, 73, 0.08) !important;
      border-color: rgba(248, 81, 73, 0.4) !important;
      color: #F85149 !important;
    }
    /* Mensaje custom de success (lo inserta nuestro JS) */
    .declara-success {
      background: linear-gradient(135deg, rgba(94, 229, 161, 0.12) 0%, rgba(46, 190, 122, 0.08) 100%);
      border: 1.5px solid rgba(94, 229, 161, 0.45);
      border-radius: 14px;
      padding: 24px 28px;
      text-align: center;
      animation: successIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      box-shadow: 0 0 32px rgba(94, 229, 161, 0.15);
    }
    @keyframes successIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .declara-success-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      background: var(--mint);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--obsidian);
      font-size: 26px;
      font-weight: 900;
      box-shadow: 0 0 24px rgba(94, 229, 161, 0.4);
      animation: successPulse 2.4s ease-in-out infinite;
    }
    @keyframes successPulse {
      0%, 100% { box-shadow: 0 0 24px rgba(94, 229, 161, 0.4); }
      50%      { box-shadow: 0 0 36px rgba(94, 229, 161, 0.7); }
    }
    .declara-success-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-strong);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    .declara-success-text {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Mobile tweaks para el form */
    @media (max-width: 640px) {
      .formkit-form[data-uid="267ce23abe"] .formkit-fields {
        flex-direction: column !important;
      }
      .formkit-form[data-uid="267ce23abe"] .formkit-submit {
        width: 100% !important;
        min-width: 0 !important;
      }
      .formkit-form[data-uid="267ce23abe"] .formkit-input,
      .formkit-form[data-uid="267ce23abe"] .formkit-submit {
        height: 54px !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="Declara.pe">D</div>

    <h1>Pronto.</h1>

    <p class="tagline">
      Contabilidad inteligente para PYMEs del Perú.<br>
      <strong>Sin Excel. Sin estrés. Sin sorpresas con SUNAT.</strong>
    </p>

    <div class="waitlist">
      <div class="waitlist-eyebrow">Sumate a la waitlist</div>

      <!-- ===== Kit (ConvertKit) embed - Waitlist Declara.pe ===== -->
      <script src="https://f.convertkit.com/ckjs/ck.5.js"></script>
      <div id="declara-waitlist-wrap">
        <form id="declara-waitlist-form" action="https://app.kit.com/forms/9464030/subscriptions" class="seva-form formkit-form" method="post" data-sv-form="9464030" data-uid="267ce23abe" data-format="inline" data-version="5">
          <div data-style="clean">
            <ul class="formkit-alert formkit-alert-error" data-element="errors" data-group="alert"></ul>
            <div data-element="fields" data-stacked="false" class="seva-fields formkit-fields">
              <div class="formkit-field">
                <input class="formkit-input" name="email_address" aria-label="tu@email.com" placeholder="tu@email.com" required type="email" autocomplete="email">
              </div>
              <button data-element="submit" class="formkit-submit formkit-submit">
                <div class="formkit-spinner"><div></div><div></div><div></div></div>
                <span>Avisame</span>
              </button>
            </div>
          </div>
        </form>
        <p class="waitlist-note" id="declara-waitlist-note">Te escribimos cuando arrancamos. Cero spam.</p>
      </div>

      <!-- Interceptor: localiza mensajes de Kit a español + reemplaza success -->
      <script>
        (function() {
          var form = document.getElementById('declara-waitlist-form');
          var wrap = document.getElementById('declara-waitlist-wrap');
          var note = document.getElementById('declara-waitlist-note');
          if (!form || !wrap) return;

          // Traducciones de mensajes de Kit
          var translations = {
            "Thank you for signing up.": "¡Listo! Te avisamos cuando arrancamos.",
            "Thank you for subscribing!": "¡Listo! Te avisamos cuando arrancamos.",
            "Please enter a valid email address.": "Ingresá un email válido.",
            "This field is required.": "Este campo es obligatorio.",
            "Something went wrong.": "Algo salió mal. Intentá de nuevo en un minuto.",
            "Network error. Please try again.": "Error de red. Intentá de nuevo en un minuto."
          };

          function translateNode(node) {
            if (node.nodeType === 3) {
              var t = node.textContent.trim();
              if (translations[t]) node.textContent = translations[t];
            } else if (node.nodeType === 1) {
              node.childNodes.forEach(translateNode);
            }
          }

          // Observar cambios en el form (Kit reemplaza contenido al success)
          var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(m) {
              m.addedNodes.forEach(function(n) {
                // Detectar success: Kit pone un mensaje tipo "Thank you for signing up"
                if (n.nodeType === 1) {
                  var text = (n.textContent || '').trim();
                  if (/thank you for (signing up|subscribing)/i.test(text)) {
                    // Reemplazar TODO el form con nuestro mensaje custom
                    showSuccess();
                    observer.disconnect();
                    return;
                  }
                  // Traducir alerts u otros textos
                  translateNode(n);
                }
              });
            });
          });

          observer.observe(form, { childList: true, subtree: true });

          function showSuccess() {
            wrap.innerHTML = '' +
              '<div class="declara-success" role="status" aria-live="polite">' +
                '<div class="declara-success-icon">✓</div>' +
                '<div class="declara-success-title">¡Listo!</div>' +
                '<div class="declara-success-text">Te avisamos por email cuando arrancamos. Sin spam.</div>' +
              '</div>';
            if (note && note.parentNode) note.parentNode.removeChild(note);
          }

          // Backup: si Kit redirige o algo, también escuchar el submit
          form.addEventListener('submit', function() {
            // Después de 1.5s, traducir cualquier mensaje que aparezca
            setTimeout(function() { translateNode(form); }, 1500);
          });
        })();
      </script>
    </div>
  </main>

  <footer>
    <div class="handle">
      <a href="https://instagram.com/declara.pe" target="_blank" rel="noopener">@declara.pe</a>
    </div>
    <div class="copyright">© 2026 SOULWOVEN CO E.I.R.L. · RUC 20615441300</div>
  </footer>
</body>
</html>
